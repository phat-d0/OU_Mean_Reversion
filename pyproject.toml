[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ou_model"
version = "0.1.0"
description = "Research-only Ornstein-Uhlenbeck mean-reversion modelling and backtesting on equity, commodity and FX spreads."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "statsmodels>=0.14",
    "scipy>=1.12",
    "yfinance>=0.2.40",
    "plotly>=5.20",
    "streamlit>=1.35",
    "pyarrow>=15",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["ou_model*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
